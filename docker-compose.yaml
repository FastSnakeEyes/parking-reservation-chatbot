services:
  api:
    build: .
    ports:
      - "${API_PORT}:8000"
    env_file:
      - ${ENV_FILE:-.env.development}
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE}
    env_file:
      - ${ENV_FILE:-.env.development}
    ports:
      - "${BIND_ADDRESS}:${POSTGRES_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    ports:
      - "${BIND_ADDRESS}:${REDIS_PUBLISHED_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Milvus standalone with embedded etcd and local storage (no MinIO / etcd containers)
  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.4}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "${BIND_ADDRESS}:${MILVUS_PUBLISHED_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  milvus_data: